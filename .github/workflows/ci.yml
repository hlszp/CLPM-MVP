name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  CI: "true"

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint apps/web-antd --cache

      # vitest 单元测试（workspace 全量，阻塞门禁）
      - name: Unit tests (vitest)
        run: pnpm run test:unit

      - name: Typecheck
        run: pnpm -F @vben/web-antd run typecheck

      - name: Build
        run: pnpm build:antd

      # S3-C6: E2E 测试（首次集成，非阻塞）
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Run E2E tests
        run: pnpm -F @vben/web-antd run e2e
        continue-on-error: true

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # 整改 S1-a：CI 此前只有 Redis，PG 相关门禁（迁移链、schema 漂移）
      # 仅存在于 lefthook pre-push，CI 侧完全无守护——2026-08-31 首装阻断
      # （01_schema.sql 外键类型不匹配致 initdb 中途中止）正是此类漏洞。
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clpm
          POSTGRES_PASSWORD: clpm_ci_only_2026
          POSTGRES_DB: clpm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clpm -d clpm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # S3-C7: mypy 类型检查（首次集成，非阻塞）
      - name: Mypy type check
        run: uv run mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      # 整改 S1-a：在真实 PostgreSQL 上验证「生产引导路径」。
      # 此前 CI 无 PG、测试全用 mock DB session（tests/conftest.py 明示
      # "无需 PostgreSQL/Redis"），且 addopts 默认 -m 'not integration'，
      # 导致引导 SQL、迁移 stamp、模型-库对齐在 CI 侧零验证。
      #
      # 口径说明（新发现 G51，见整改方案）：本仓库迁移链**不能从空库构建**——
      # 早期迁移以 01_schema.sql 已建表为前提（如 ALTER TABLE loop_ledger），
      # 空库上跑 alembic upgrade head 会以 UndefinedTableError 失败。
      # 故正确口径是「应用引导 SQL -> stamp head -> 漂移检查」，与生产
      # deploy/lib-migrate.sh 的实际顺序一致。
      # 该步骤可捕获：01_schema.sql 载入失败（08-31 首装阻断同类）、
      # 引导 SQL 与 ORM 元数据漂移、种子数据回归。
      - name: 引导 SQL + schema 漂移检查（真实 PG）
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: clpm
          POSTGRES_PASSWORD: clpm_ci_only_2026
          POSTGRES_DB: clpm
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long!!!
        run: |
          uv run python scripts/apply_bootstrap_sql.py
          uv run alembic stamp head
          uv run alembic check

      # S3-C7: Pytest with coverage（首次集成使用 60% 门槛）
      - name: Pytest with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=60
