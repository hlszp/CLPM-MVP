name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  CI: "true"

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -F @vben/web-antd run typecheck

      - name: Build
        run: pnpm build:antd

      # S3-C6: E2E 测试（首次集成，非阻塞）
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Run E2E tests
        run: pnpm -F @vben/web-antd run e2e
        continue-on-error: true

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # S3-C7: mypy 类型检查（首次集成，非阻塞）
      - name: Mypy type check
        run: uv run mypy app/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      # S3-C7: Pytest with coverage（首次集成使用 60% 门槛）
      - name: Pytest with coverage
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=60
