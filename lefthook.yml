# ============================================================
# CLPM Git 钩子门禁（lefthook）
# 与 build-and-deploy.sh Phase 0 构建门禁同口径：
# gitea 侧无 CI，本地检查即门禁（见 AGENTS.md「CI 提交前本地检查」）
# ============================================================

pre-push:
  # 串行执行：后端门禁失败则不必再跑前端，尽快反馈
  parallel: false
  jobs:
    - name: backend ruff check + format
      run: cd backend && uv run ruff check . && uv run ruff format --check .

    - name: backend pytest
      run: cd backend && uv run pytest -x -q

    # schema 漂移检查（AGENTS.md「CI 提交前本地检查」同口径）：
    # 退出码非 0 即中止；本地数据库不可用时 alembic 同样非 0 退出，
    # 钩子中止推送并直接显示连接错误，不静默跳过
    - name: backend alembic schema drift
      run: cd backend && uv run alembic check

    - name: frontend type check
      run: cd frontend && pnpm run check:type

    # 整改 D3：hex 硬编码白名单守护（棘轮只减不增，新增债务拦截）
    - name: frontend hex whitelist
      run: node scripts/check-hex-whitelist.mjs

pre-commit:
  parallel: true
  jobs:
    # 仅对暂存的 Python 文件做 ruff 检查（快速反馈，全量检查在 pre-push）
    # root 指定后 glob 与 {staged_files} 均相对 backend/ 解析
    - name: ruff staged
      root: backend/
      glob: "*.py"
      run: uv run ruff check {staged_files}
