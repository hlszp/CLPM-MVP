# ============================================================
# CLPM 生产环境 Docker Compose 编排
# 启动: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# 停止: docker compose --env-file .env.prod -f docker-compose.prod.yml down
# 重置: docker compose --env-file .env.prod -f docker-compose.prod.yml down -v
# 查看日志: docker compose --env-file .env.prod -f docker-compose.prod.yml logs -f
# ============================================================

name: clpm-prod

services:
  # ============================================================
  # 后端 API 服务（FastAPI + Uvicorn）
  # S2-B3: 不暴露 8001 端口到宿主机，仅通过 nginx 反向代理访问
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # 版本号注入镜像 ENV（git tag 或 commit），deploy.sh 构建时可用
        # APP_VERSION=xxx 前缀指定，默认 dev
        APP_VERSION: ${APP_VERSION:-dev}
    image: clpm-backend:latest
    container_name: clpm-backend
    # S2-B3: 端口不映射到宿主机，仅容器间网络可达
    expose:
      - "7101"
    env_file: .env.prod
    environment:
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # 前端服务（Nginx 静态托管 + 反向代理）
  # 暴露 7141 到宿主机（HTTP 模式，后续升级 SSL 可开放 7142）
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: clpm-frontend:latest
    container_name: clpm-frontend
    ports:
      - "7141:7141"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7141/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # PostgreSQL 16 - 关系型业务数据
  # S2-B3: 不暴露端口到宿主机
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: clpm-postgres
    command: postgres -c port=5432
    env_file: .env.prod
    environment:
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgresql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/postgresql/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # TDengine 3.3 - 时序数据库（回路波形数据）
  # S2-B3: 不暴露端口到宿主机
  # ============================================================
  tdengine:
    # TDengine 3.3.6.6 起 Docker 镜像才支持 TAOS_ROOT_PASSWORD。
    # 计算类历史数据一律本地 TDengine（2026-07-20 架构决策），部署
    # 脚本恒启用 --profile tdengine；DATA_SOURCE_TYPE 已废止。
    profiles: ["tdengine"]
    image: tdengine/tdengine:3.3.6.6
    container_name: clpm-tdengine
    env_file: .env.prod
    environment:
      TAOS_FQDN: clpm-tdengine
      TAOS_ROOT_PASSWORD: ${TDENGINE_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - tdengine_data:/var/lib/taos
      # TDengine entrypoint 从 /docker-entrypoint-initdb.d/ 读取初始化 SQL
      # （/root/init/ 不是 entrypoint 读取路径，挂载到那里初始化脚本不会执行）
      - ./db/tdengine/01_supertable.sql:/docker-entrypoint-initdb.d/01_supertable.sql:ro
      # 密码已改标记：TDentrypoint 每次启动都用默认密码 taosdata 登录执行
      # ALTER USER 改密，但卷 tdengine_data 持久化后密码已改，默认密码登录失败
      # 导致 exit 255 崩溃循环。挂载此标记文件让 entrypoint 检测到后跳过 ALTER USER。
      # 标记文件由 build-and-deploy.sh 在非首次部署（卷已存在）时自动创建。
      - ./.td-password-changed:/.docker-entrypoint-root-password-changed
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'taos -u root -p"$${TAOS_ROOT_PASSWORD}" -s "SELECT SERVER_VERSION();"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # Redis 7 - 缓存与消息队列
  # S2-B3: 不暴露端口到宿主机
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: clpm-redis
    env_file: .env.prod
    # 在容器内从 env_file 展开密码，避免依赖 Compose 进程的宿主机环境变量。
    command:
      - sh
      - -c
      - exec redis-server --port 6379 --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    # 端口不映射到宿主机
    expose:
      - "6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli -p 6379 ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # Celery Worker - 异步任务执行（KPI 计算、诊断引擎、报表生成）
  # ============================================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: clpm-backend:latest
    container_name: clpm-celery-worker
    # 回填任务 chord 会派发多个窗口子任务（每窗口 1 个），并发度直接决定回填吞吐。
    # 默认 8（每子任务约吃满 1 核），请按宿主机可用核数调整 CELERY_WORKER_CONCURRENCY。
    command: celery -A app.tasks.celery_app worker -l info -Q default --concurrency=${CELERY_WORKER_CONCURRENCY:-8}
    env_file: .env.prod
    environment:
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # 健康检查：通过 celery inspect ping 检测 worker 存活
    # 注意：用 CMD-SHELL 让 $HOSTNAME 被 shell 展开（CMD 格式不经过 shell，$HOSTNAME 不会展开）
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          # 与 --concurrency（默认 8）匹配：每子任务约 1 核 + 取数/预处理内存
          memory: 6G
          cpus: "8.0"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # Celery Beat - 定时任务调度（AAS 同步、KPI 快照）
  # S2-A6: 死信队列消费者（可选，取消注释启用）
  # ============================================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: clpm-backend:latest
    container_name: clpm-celery-beat
    command: celery -A app.tasks.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    env_file: .env.prod
    environment:
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
    # 健康检查：beat 是无 broker 探测接口的单进程调度器。
    # 之前用 celery inspect ping 探测的是 worker 而非 beat（beat 容器内无 worker），
    # 永远 unhealthy。改为校验 PID 1 命令行含 beat（/proc 任意 Linux 容器可用，
    # slim 镜像无 pgrep）。
    healthcheck:
      test: ["CMD-SHELL", "grep -aq beat /proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # 死信队列消费者（S2-A6）— 消费 dead_letter 队列，记录永久失败任务
  # 启用：取消注释以下服务
  # ============================================================
  # celery-dead-letter:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.backend
  #   image: clpm-backend:latest
  #   container_name: clpm-celery-dead-letter
  #   command: uv run celery -A app.tasks.celery_app worker -l info -Q dead_letter
  #   env_file: .env.prod
  #   environment:
  #     TZ: Asia/Shanghai
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: "0.5"
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"
  #   restart: unless-stopped
  #   networks:
  #     - clpm-net

  # ============================================================
  # Prometheus - 指标采集与告警（可选 profile：monitoring）
  # 启用: docker compose --env-file .env.prod -f docker-compose.prod.yml --profile tdengine --profile monitoring up -d
  # 不暴露端口到宿主机：通过 Grafana 或 SSH 隧道（ssh -L 9090:localhost:9090 需自行映射）访问
  # ============================================================
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.53.4
    container_name: clpm-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # Grafana - 可观测性面板（可选 profile：monitoring）
  # 预置 CLPM 总览 dashboard（deploy/grafana/dashboards）与 Prometheus 数据源
  # 不暴露端口到宿主机：SSH 隧道访问（ssh -L 3100:<服务器IP>:3100 需自行映射，
  # 或临时加 ports 映射）。默认账号 admin / ${GRAFANA_ADMIN_PASSWORD:-admin}
  # ============================================================
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.1.0
    container_name: clpm-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # Node Exporter - 宿主机磁盘/CPU/内存指标（可选 profile：monitoring）
  # 磁盘告警（ClpmNodeDiskLow）依赖此服务
  # ============================================================
  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.8.2
    container_name: clpm-node-exporter
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

# ============================================================
# 数据卷
# ============================================================
volumes:
  postgres_data:
    name: clpm_postgres_data
  tdengine_data:
    name: clpm_tdengine_data
  redis_data:
    name: clpm_redis_data
  prometheus_data:
    name: clpm_prometheus_data
  grafana_data:
    name: clpm_grafana_data

# ============================================================
# 网络
# ============================================================
networks:
  clpm-net:
    name: clpm-prod-net
    driver: bridge
