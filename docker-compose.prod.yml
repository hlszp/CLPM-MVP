# ============================================================
# CLPM 生产环境 Docker Compose 编排
# 启动: docker compose -f docker-compose.prod.yml up -d
# 停止: docker compose -f docker-compose.prod.yml down
# 重置: docker compose -f docker-compose.prod.yml down -v
# 查看日志: docker compose -f docker-compose.prod.yml logs -f
# ============================================================

name: clpm-prod

services:
  # ============================================================
  # 后端 API 服务（FastAPI + Uvicorn）
  # S2-B3: 不暴露 8001 端口到宿主机，仅通过 nginx 反向代理访问
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: clpm-backend:latest
    container_name: clpm-backend
    # S2-B3: 端口不映射到宿主机，仅容器间网络可达
    expose:
      - "7101"
    env_file: .env.prod
    environment:
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # 前端服务（Nginx 静态托管 + 反向代理）
  # 暴露 7141 到宿主机（HTTP 模式，后续升级 SSL 可开放 7142）
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: clpm-frontend:latest
    container_name: clpm-frontend
    ports:
      - "7141:7141"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7141/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # PostgreSQL 16 - 关系型业务数据
  # S2-B3: 不暴露端口到宿主机
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: clpm-postgres
    command: postgres -c port=7102
    env_file: .env.prod
    environment:
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgresql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/postgresql/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -p 7102"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # Redis 7 - 缓存与消息队列
  # S2-B3: 不暴露端口到宿主机
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: clpm-redis
    env_file: .env.prod
    command: redis-server --port 7103 --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    # 端口不映射到宿主机
    expose:
      - "7103"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7103 -a $${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # Celery Worker - 异步任务执行（KPI 计算、诊断引擎、报表生成）
  # ============================================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: clpm-backend:latest
    container_name: clpm-celery-worker
    command: celery -A app.tasks.celery_app worker -l info -Q default
    env_file: .env.prod
    environment:
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # 健康检查：通过 celery inspect ping 检测 worker 存活
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # Celery Beat - 定时任务调度（AAS 同步、KPI 快照）
  # S2-A6: 死信队列消费者（可选，取消注释启用）
  # ============================================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: clpm-backend:latest
    container_name: clpm-celery-beat
    command: celery -A app.tasks.celery_app beat -l info
    env_file: .env.prod
    environment:
      TZ: Asia/Shanghai
    depends_on:
      redis:
        condition: service_healthy
    # 健康检查：检测 celery beat 进程存活
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout 5 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # S2-B1: 资源限制
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    # S2-B2: 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - clpm-net

  # ============================================================
  # 死信队列消费者（S2-A6）— 消费 dead_letter 队列，记录永久失败任务
  # 启用：取消注释以下服务
  # ============================================================
  # celery-dead-letter:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.backend
  #   image: clpm-backend:latest
  #   container_name: clpm-celery-dead-letter
  #   command: uv run celery -A app.tasks.celery_app worker -l info -Q dead_letter
  #   env_file: .env.prod
  #   environment:
  #     TZ: Asia/Shanghai
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M
  #         cpus: "0.5"
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"
  #   restart: unless-stopped
  #   networks:
  #     - clpm-net

# ============================================================
# 数据卷
# ============================================================
volumes:
  postgres_data:
    name: clpm_postgres_data
  redis_data:
    name: clpm_redis_data

# ============================================================
# 网络
# ============================================================
networks:
  clpm-net:
    name: clpm-prod-net
    driver: bridge
