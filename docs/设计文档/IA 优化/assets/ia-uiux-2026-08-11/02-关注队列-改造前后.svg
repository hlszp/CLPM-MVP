    <text x="66" y="410" fill="#c73949">高</text><text x="100" y="410" fill="#c73949">活跃预警</text><text x="172" y="410" class="mono">80TIC10506</text><text x="292" y="410">CONFIDENCE_DEGRADED 触发</text><text x="496" y="410" fill="#c73949">待处理</text><text x="560" y="410" class="mono">22:04</text><text x="678" y="410" fill="#1769c2">详情　工作台</text>
    <text x="66" y="460" fill="#c73949">高</text><text x="100" y="460" fill="#c73949">活跃预警</text><text x="172" y="460" class="mono">41PIC40506</text><text x="292" y="460">CONFIDENCE_DEGRADED 触发</text><text x="496" y="460" fill="#c73949">待处理</text><text x="560" y="460" class="mono">22:04</text><text x="678" y="460" fill="#1769c2">详情　工作台</text>
