  <rect x="816" y="96" width="752" height="772" rx="10" class="panel"/>
  <rect x="32" y="96" width="752" height="52" rx="10" fill="#e7ebf0"/>
  <rect x="816" y="96" width="752" height="52" rx="10" fill="#172033"/>
