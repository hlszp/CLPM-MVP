  <rect x="548" y="726" width="200" height="24" rx="12" class="callout"/><text x="561" y="742" class="calloutText">② 无 owner / SLA / 受理承诺</text>
  <rect x="65" y="786" width="200" height="24" rx="12" class="callout"/><text x="78" y="802" class="calloutText">③ 多来源相似项增加扫视负担</text>

  <!-- Target -->
  <rect x="836" y="164" width="712" height="46" rx="4" class="surface"/>
  <text x="852" y="183" class="small">范围</text><text x="852" y="199" class="label">全厂 · 全部装置</text>
  <text x="1000" y="183" class="small">视图</text><text x="1000" y="199" class="label">待我受理 · 高风险优先</text>
