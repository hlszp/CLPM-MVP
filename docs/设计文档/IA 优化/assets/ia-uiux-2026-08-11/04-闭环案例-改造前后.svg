<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CLPM 闭环案例改造前后线框</title>
  <desc id="desc">左侧为当前以诊断列表和回路为主键的异常跟踪页，右侧为以 trackerId 为主键的闭环案例工作区。</desc>
  <style>
    text { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
    .h1 { font-size: 28px; font-weight: 700; }.h2 { font-size: 18px; font-weight: 700; }
    .h3 { font-size: 14px; font-weight: 650; }.body { font-size: 12px; }
    .small { font-size: 10px; fill: #667085; }.label { font-size: 11px; font-weight: 650; fill: #344054; }
    .panel { fill: #fff; stroke: #cbd5e1; }.surface { fill: #f8fafc; stroke: #d7e0ea; }
    .blue { fill: #e9f2ff; stroke: #7db2f7; }.amber { fill: #fff5df; stroke: #e9b949; }
    .rose { fill: #fff0f1; stroke: #e26d78; }.green { fill: #edf8f1; stroke: #5ca979; }
    .callout { fill: #172033; }.calloutText { font-size: 10px; font-weight: 650; fill: #fff; }
    .white { fill: #fff !important; }
  </style>
  <rect width="1600" height="900" fill="#eef3f7"/>
  <text x="40" y="46" class="h1">样板 04｜闭环案例：从“按回路更新状态”到“可审计治理档案”</text>
  <text x="40" y="72" class="body" fill="#667085">结构线框 · 页面重构前置：类型化干预契约 + trackerId-first API</text>
  <rect x="32" y="96" width="752" height="772" rx="10" class="panel"/>
  <rect x="816" y="96" width="752" height="772" rx="10" class="panel"/>
  <rect x="32" y="96" width="752" height="52" rx="10" fill="#e7ebf0"/>
  <rect x="816" y="96" width="752" height="52" rx="10" fill="#172033"/>
  <text x="56" y="129" class="h2">当前结构｜异常跟踪台账</text>
  <text x="840" y="129" class="h2 white">目标结构｜闭环案例工作区</text>

  <!-- Current -->
  <rect x="52" y="164" width="712" height="74" rx="4" class="surface"/>
  <text x="68" y="190" class="h3">异常跟踪</text><text x="140" y="190" class="small">状态、标签、时间窗统一筛选</text>
  <rect x="392" y="178" width="106" height="24" rx="3" class="panel"/><text x="414" y="194" class="small">严重度</text>
  <rect x="506" y="178" width="106" height="24" rx="3" class="panel"/><text x="528" y="194" class="small">诊断标签</text>
  <rect x="392" y="206" width="106" height="24" rx="3" class="panel"/><text x="414" y="222" class="small">处理状态</text>
  <rect x="506" y="206" width="106" height="24" rx="3" class="panel"/><text x="536" y="222" class="small">近 7 天</text>
  <rect x="52" y="250" width="712" height="68" rx="4" class="surface"/>
  <rect x="52" y="250" width="178" height="68" class="panel"/><rect x="230" y="250" width="178" height="68" class="panel"/>
  <rect x="408" y="250" width="178" height="68" class="panel"/><rect x="586" y="250" width="178" height="68" class="panel"/>
  <text x="68" y="274" class="small">待处理</text><text x="68" y="300" class="h3 mono">0</text>
  <text x="246" y="274" class="small">处理中</text><text x="246" y="300" class="h3 mono">0</text>
  <text x="424" y="274" class="small">已实施</text><text x="424" y="300" class="h3 mono">0</text>
  <text x="602" y="274" class="small">已忽略</text><text x="602" y="300" class="h3 mono">0</text>
  <rect x="52" y="330" width="712" height="46" rx="4" class="surface"/>
  <text x="68" y="358" class="small">状态流转　待处理　→　处理中　→　已实施　/　已忽略</text>
  <rect x="52" y="388" width="712" height="444" rx="4" class="surface"/>
  <text x="68" y="416" class="h3">异常跟踪列表</text>
  <rect x="68" y="434" width="680" height="38" fill="#f2f4f7" stroke="#d7e0ea"/>
  <text x="80" y="458" class="small">严重度｜回路｜装置｜标签｜评分｜可信度｜状态｜负责人｜操作</text>
  <rect x="68" y="472" width="680" height="336" class="panel"/>
  <rect x="304" y="550" width="208" height="112" rx="6" fill="#eef2f6"/>
  <text x="365" y="590" class="h3">暂无待处理异常</text>
  <text x="337" y="616" class="small">筛选无结果与无开放案例未区分</text>
  <text x="349" y="642" class="small">行主键实际使用 loopId</text>
  <rect x="541" y="396" width="194" height="24" rx="12" class="callout"/><text x="554" y="412" class="calloutText">① 不是 trackerId 案例列表</text>
  <rect x="568" y="338" width="168" height="24" rx="12" class="callout"/><text x="581" y="354" class="calloutText">② 状态流仍是旧四态</text>
  <rect x="72" y="792" width="196" height="24" rx="12" class="callout"/><text x="85" y="808" class="calloutText">③ 实施证据、责任交接不可见</text>

  <!-- Target -->
  <rect x="836" y="164" width="712" height="54" rx="4" class="amber"/>
  <text x="852" y="184" class="small">实施门禁</text>
  <text x="852" y="204" class="label">一行必须对应一个 trackerId；先完成类型化干预、证据字段与合法转换 API</text>
  <rect x="836" y="230" width="178" height="606" rx="6" class="surface"/>
  <rect x="1026" y="230" width="334" height="606" rx="6" class="surface"/>
  <rect x="1372" y="230" width="176" height="606" rx="6" class="surface"/>

  <text x="852" y="258" class="h3">Case Queue</text>
  <rect x="850" y="270" width="150" height="32" rx="4" class="panel"/><text x="862" y="291" class="small">我的开放项 / 待验证</text>
  <rect x="846" y="316" width="158" height="94" rx="4" class="rose"/>
  <text x="858" y="338" class="small mono">CASE-2026-0811</text>
  <text x="858" y="360" class="label mono">41LIC4201</text>
  <text x="858" y="380" class="small">PID_TUNING · 验证超期</text>
  <text x="858" y="398" class="small">张工 · +6 h</text>
  <rect x="846" y="420" width="158" height="94" rx="4" class="amber"/>
  <text x="858" y="442" class="small mono">CASE-2026-0807</text>
  <text x="858" y="464" class="label mono">80FIC31402</text>
  <text x="858" y="484" class="small">DATA_REPAIR · 实施中</text>
  <text x="858" y="502" class="small">李工 · 到期 14:00</text>
  <rect x="846" y="524" width="158" height="94" rx="4" class="panel"/>
  <text x="858" y="546" class="small mono">CASE-2026-0802</text>
  <text x="858" y="568" class="label mono">41PIC40506</text>
  <text x="858" y="588" class="small">设备维修 · 待计划</text>
  <text x="858" y="606" class="small">未指派</text>
  <text x="852" y="648" class="small">同一回路多个历史案例可并存</text>
  <text x="852" y="670" class="small">筛选：类型 / 状态 / owner / due</text>

  <text x="1042" y="258" class="h3">CASE-2026-0811 · 41LIC4201_PIDA</text>
  <text x="1042" y="280" class="small">来源：诊断 v7 / 关注项 ATT-284　重要度：安全关键</text>
  <rect x="1042" y="296" width="300" height="48" rx="4" class="surface"/>
  <text x="1056" y="326" class="small">受理　→　计划　→　实施　→　验证　→　闭环 / 重开</text>
  <rect x="1190" y="306" width="52" height="28" rx="14" class="blue"/><text x="1205" y="324" class="label">验证</text>

  <rect x="1042" y="358" width="300" height="224" rx="5" class="panel"/>
  <text x="1058" y="384" class="h3">Evidence Canvas</text>
  <text x="1058" y="410" class="small">来源证据　评分下降 8.2 / 阀门粘滞 0.84</text>
  <text x="1058" y="434" class="small">干预方案　PID P 1.20→1.05，I 45→52 s</text>
  <text x="1058" y="458" class="small">审批 / MOC　MOC-2026-081 · 已批准</text>
  <text x="1058" y="482" class="small">人工实施　王工 · 08-10 08:00 · 已留痕</text>
  <line x1="1058" y1="520" x2="1326" y2="520" stroke="#d7e0ea"/>
  <polyline points="1058,548 1082,526 1106,552 1130,530 1154,548 1178,532 1202,544 1226,536 1250,542 1274,538 1298,540 1326,538" fill="none" stroke="#1769c2" stroke-width="2.5"/>
  <text x="1058" y="572" class="small">实施前后对比 · 振荡指数 -31% · 采样 24 h</text>
  <rect x="1042" y="596" width="300" height="216" rx="5" class="surface"/>
  <text x="1058" y="622" class="h3">Audit Timeline</text>
  <line x1="1070" y1="646" x2="1070" y2="782" stroke="#94a3b8"/>
  <circle cx="1070" cy="654" r="5" fill="#1769c2"/><text x="1086" y="658" class="small">08-07 09:20　张工受理并设定期限</text>
  <circle cx="1070" cy="688" r="5" fill="#1769c2"/><text x="1086" y="692" class="small">08-08 15:10　MOC 审批通过</text>
  <circle cx="1070" cy="722" r="5" fill="#1769c2"/><text x="1086" y="726" class="small">08-10 08:00　王工记录人工实施</text>
  <circle cx="1070" cy="756" r="5" fill="#c07b17"/><text x="1086" y="760" class="small">08-11 08:00　验证窗完成，待独立复核</text>
  <circle cx="1070" cy="790" r="5" fill="#d64555"/><text x="1086" y="794" class="small">08-11 14:00　已超期 6 h</text>

  <text x="1390" y="258" class="h3">Decision Dock</text>
  <rect x="1388" y="274" width="144" height="96" rx="4" class="blue"/>
  <text x="1400" y="298" class="small">当前唯一动作</text>
  <text x="1400" y="322" class="label">复核验证证据</text>
  <text x="1400" y="342" class="label">并关闭或重开</text>
  <text x="1400" y="362" class="small">需 verifier 权限</text>
  <text x="1390" y="404" class="small">owner</text><text x="1484" y="404" class="label">张工</text>
  <text x="1390" y="430" class="small">实施者</text><text x="1484" y="430" class="label">王工</text>
  <text x="1390" y="456" class="small">验证者</text><text x="1484" y="456" class="label">赵工</text>
  <text x="1390" y="482" class="small">到期</text><text x="1484" y="482" class="label mono">+6 h</text>
  <rect x="1388" y="508" width="144" height="40" rx="4" fill="#1769c2"/><text x="1418" y="533" class="label white">开始验证复核</text>
  <rect x="1388" y="560" width="144" height="34" rx="4" class="panel"/><text x="1422" y="581" class="label">导出案例包</text>
  <rect x="1388" y="606" width="144" height="34" rx="4" class="panel"/><text x="1422" y="627" class="label">查看来源证据</text>
  <rect x="1388" y="670" width="144" height="116" rx="4" class="amber"/>
  <text x="1400" y="694" class="small">类型化必填</text>
  <text x="1400" y="716" class="label">PID：实际参数 + MOC</text>
  <text x="1400" y="738" class="label">数据修复：完整性证据</text>
  <text x="1400" y="760" class="small">不对非 PID 强制 PID 字段</text>

  <rect x="839" y="236" width="162" height="24" rx="12" class="callout"/><text x="852" y="252" class="calloutText">① 一行一个持久案例</text>
  <rect x="1200" y="236" width="142" height="24" rx="12" class="callout"/><text x="1213" y="252" class="calloutText">② 全链路证据档案</text>
  <rect x="1390" y="236" width="140" height="24" rx="12" class="callout"/><text x="1403" y="252" class="calloutText">③ 合法动作由后端返回</text>

  <text x="40" y="890" class="small">设计意图：闭环案例不是 Tracker 换名；必须以 trackerId、类型化干预、责任交接、实施证据和验证结论构成可审计对象。</text>
</svg>
