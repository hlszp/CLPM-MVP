  <rect x="380" y="326" width="74" height="30" rx="4" fill="#1769c2"/><text x="393" y="345" class="label white">重新评估</text>
  <text x="498" y="328" class="h3">8 项待处理</text><text x="498" y="350" class="small">重复预警摘要横向铺开</text>
