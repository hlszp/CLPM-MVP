  <text x="66" y="238" class="small mono">在线　41LIC4201_PIDA　PV 50.48%　SP 50%　OP 49.95%　Auto　Good　08:42:16</text>
  <rect x="52" y="260" width="712" height="32" rx="4" class="surface"/>
  <text x="68" y="280" class="small">1 监控　→　2 评估　→　3 诊断　→　4 整定　→　5 验证</text>
  <rect x="52" y="302" width="420" height="76" rx="4" class="surface"/>
  <rect x="482" y="302" width="282" height="76" rx="4" class="surface"/>
