<!doctype html><meta charset="utf-8"><title>Independent route fixture</title><h1>Independent route fixture</h1><pre id="route"></pre><script>function applicationRoute(url) {
    return url.hash.startsWith('#/') ? new URL(url.hash.slice(1), url.origin) : url;
}
function applicationRouteUrl(current, path) {
    const route = new URL(path, current.origin);
    if (!current.hash.startsWith('#/'))
        return route.toString();
    const target = new URL(current);
    target.hash = `${route.pathname}${route.search}${route.hash}`;
    return target.toString();
}
function isAuthenticatedLanding(url, origin) {
    const route = applicationRoute(url);
    return url.origin === origin &&
        (route.pathname === '/cockpit' || route.pathname.startsWith('/cockpit/'));
}

window.helpers={applicationRoute,applicationRouteUrl,isAuthenticatedLanding};function render(){const route=applicationRoute(new URL(location.href));document.querySelector('#route').textContent=JSON.stringify({origin:location.origin,path:route.pathname,query:Object.fromEntries(route.searchParams),routeOrigin:route.origin},null,2)}render();addEventListener('hashchange',render);</script>
