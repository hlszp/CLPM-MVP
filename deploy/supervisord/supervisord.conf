; ============================================================================
; CLPM Supervisord 配置
;
; 用途：统一管理后端 API + Celery Worker 进程，实现开机自启 + 崩溃自动重启
;
; 使用方式：
;   1. 安装：brew install supervisor
;   2. 启动：supervisord -c deploy/supervisord/supervisord.conf
;   3. 管理：supervisorctl -c deploy/supervisord/supervisord.conf status|restart|stop|start all
;
; 进程清单：
;   - clpm-backend    : FastAPI + uvicorn（内含 Celery Beat 自动启动）
;   - clpm-celery-worker : Celery Worker（执行 KPI 计算、诊断等异步任务）
;   - clpm-frontend   : Vite 前端开发服务器（可选，仅开发环境）
; ============================================================================

[unix_http_server]
file=/tmp/clpm-supervisor.sock
chmod=0700

[supervisord]
logfile=%(here)s/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/clpm-supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/clpm-supervisor.sock

; ============================================================================
; 后端 API (uvicorn + FastAPI)
; 启动后 lifespan 自动拉起 Celery Beat 调度进程
; ============================================================================
[program:clpm-backend]
command=%(here)s/../../backend/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 7101 --reload
directory=%(here)s/../../backend
environment=ENV="development",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=%(here)s/logs/backend.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=%(here)s/logs/backend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================================
; Celery Worker（异步任务执行器）
; 执行 KPI 计算、回路诊断、报表生成等 Celery 任务
; 注意：Beat 已随后端 lifespan 自动启动，此处仅配置 Worker
; ============================================================================
[program:clpm-celery-worker]
command=%(here)s/../../backend/.venv/bin/celery -A app.tasks.celery_app worker -l info -Q default
directory=%(here)s/../../backend
environment=ENV="development",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=30
stopsignal=TERM
stdout_logfile=%(here)s/logs/celery-worker.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=%(here)s/logs/celery-worker.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ============================================================================
; 前端开发服务器（可选，仅开发环境需要）
; 生产环境由 nginx 托管静态文件，不需要此进程
; ============================================================================
[program:clpm-frontend]
command=%(ENV_PNPM_PATH)s run dev:antd
directory=%(here)s/../../frontend
environment=NODE_ENV="development"
autostart=false
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=10
stopsignal=TERM
stdout_logfile=%(here)s/logs/frontend.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=%(here)s/logs/frontend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
