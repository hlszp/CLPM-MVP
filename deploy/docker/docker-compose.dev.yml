# CLPM-MVP 开发环境容器编排
# 使用 Orbstack 作为容器运行时
# 启动: docker compose -f deploy/docker/docker-compose.dev.yml up -d
# 停止: docker compose -f deploy/docker/docker-compose.dev.yml down
# 重置: docker compose -f deploy/docker/docker-compose.dev.yml down -v
#
# MVP 精简版端口规划：与原完整项目（CLPM，端口 7xxx 段）完全隔离
# - PostgreSQL: 17102（原 7102）
# - Redis:      17103（原 7103）
# - TDengine:   17104/17115（原 7104/7115）
# 容器名、卷名、网络名均加 -mvp 后缀避免与原项目冲突

name: clpm-mvp-dev

services:
  # ============================================================
  # PostgreSQL 16 - 关系型业务数据
  # ============================================================
  postgres:
    image: postgres:16
    container_name: clpm-mvp-postgres
    restart: unless-stopped
    ports:
      - "17102:5432"
    environment:
      POSTGRES_USER: clpm
      POSTGRES_PASSWORD: clpm_dev_2026
      POSTGRES_DB: clpm
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../../db/postgresql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../../db/postgresql/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clpm -d clpm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - clpm-mvp-net

  # ============================================================
  # TDengine 3.x - 时序数据存储
  # ============================================================
  tdengine:
    image: tdengine/tdengine:3.3.6.0
    container_name: clpm-mvp-tdengine
    restart: unless-stopped
    ports:
      - "17104:6030"
      - "17115:6041"
    environment:
      TAOS_FQDN: clpm-mvp-tdengine
      TZ: Asia/Shanghai
    volumes:
      - td_data:/var/lib/taos
      - ../../db/tdengine/01_supertable.sql:/docker-entrypoint-initdb.d/01_supertable.sql:ro
      - ./tdengine/taos.cfg:/etc/taos/taos.cfg:ro
    healthcheck:
      test: ["CMD", "taos", "-s", "SELECT SERVER_VERSION();"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - clpm-mvp-net

  # ============================================================
  # Redis 7 - 缓存与消息队列
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: clpm-mvp-redis
    restart: unless-stopped
    ports:
      - "17103:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - clpm-mvp-net

  # ============================================================
  # Mock Data Server - 模拟远端数据源服务（仅开发环境）
  # MVP 精简版已屏蔽 AAS 同步模块，mock-data-server 默认不启用
  # 如需临时启用：docker compose --profile mock up -d mock-data-server
  # ============================================================
  mock-data-server:
    profiles: ["mock"]
    build:
      context: ../..
      dockerfile: deploy/docker/mock_data_server.Dockerfile
    container_name: clpm-mvp-mock-data-server
    restart: unless-stopped
    ports:
      - "17106:7106"
    environment:
      TDENGINE_HOST: tdengine
      TDENGINE_PORT: "6030"
      TDENGINE_USER: root
      TDENGINE_PASSWORD: taosdata
      TDENGINE_DB: clpm_ts
      MOCK_DATA_SERVER_PORT: "7106"
      REALTIME_INTERVAL: "1.0"
      # 质量码异常比例（0.0=全部Good, 0.1=10%Bad），模拟工控采集场景
      QUALITY_BAD_RATIO: "0.10"
      TZ: Asia/Shanghai
    depends_on:
      tdengine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7106/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - clpm-mvp-net

# ============================================================
# 数据卷
# ============================================================
volumes:
  pg_data:
    name: clpm_mvp_pg_data
  td_data:
    name: clpm_mvp_td_data
  redis_data:
    name: clpm_mvp_redis_data

# ============================================================
# 网络
# ============================================================
networks:
  clpm-mvp-net:
    name: clpm-mvp-dev-net
    driver: bridge
