# ============================================================
# CLPM 前端 Nginx 配置（生产环境）
# - HTTP 模式（IP 直连，无 SSL）
# - 静态资源托管（SPA fallback）
# - /api/v1/ 反向代理到后端
# - WebSocket 升级支持
# - gzip 压缩
# - 静态资源缓存策略
# - 安全响应头
#
# 后续升级 HTTPS 时：
#   1. 将 SSL 证书放入 deploy/ssl/（fullchain.pem + privkey.pem）
#   2. 在 docker-compose.prod.yml 中取消 443 端口和 ssl volume 挂载
#   3. 替换本文件中的 server 块为 HTTPS 版本（见底部注释模板）
# ============================================================

# ------------------------------------------------------------
# WebSocket 连接升级映射（必须在 server 之前定义）
# ------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------
# gzip 压缩
# ------------------------------------------------------------
gzip on;
gzip_buffers 32 16k;
gzip_comp_level 6;
gzip_min_length 1k;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/x-javascript
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;

# ------------------------------------------------------------
# 上游后端服务
# ------------------------------------------------------------
upstream clpm_backend {
    server backend:7101;
    keepalive 32;
}

# ------------------------------------------------------------
# HTTP Server（生产环境主服务 — IP 直连模式）
# ------------------------------------------------------------
server {
    listen 7141;
    server_name _;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy（可用值，过紧会白屏）：
    # - script-src 含 'unsafe-inline'：vben 构建会向 index.html 注入内联
    #   loading 脚本；后续可改用 nonce/hash 收紧
    # - style-src 含 'unsafe-inline'：AntD/ECharts 运行时内联样式必需
    # - connect-src 含 ws:/wss:：SignalR/WebSocket 实时数据通道
    # - img/font-src 含 data:：ECharts 导出与图标字体内嵌
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # 请求体上限：后端 Excel 导入上限 10MB，留一倍余量；
    # 缺省 1m 会导致生产经 nginx 导入 >1MB 文件返回 413
    client_max_body_size 20m;

    # 根路径：前端静态资源
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML 不缓存，确保发布后立即生效
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        # 静态资源（带 hash 文件名）缓存 1 年
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # --------------------------------------------------------
    # API 反向代理：/api/v1/ -> http://backend:7101/api/v1/
    # --------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://clpm_backend;
        proxy_http_version 1.1;

        # 透传 Host 与原始 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://clpm_backend;
        access_log off;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

