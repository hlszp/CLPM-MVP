[project]
name = "clpm-backend"
version = "1.0.0"
description = "CLPM - Control Loop Performance Monitoring backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "bcrypt>=4.2",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "taospy>=2.7",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "asyncua>=1.7.0",
    "simpleeval>=1.0.7",
    "numpy>=2.5.0",
    "scipy>=1.18.0",
    "reportlab>=4.0",
    "prometheus_client>=0.20",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic migration scripts always import ``op`` and ``sa`` from the template,
# but individual migrations may not reference them.
"alembic/versions/*.py" = ["F401"]
# FastAPI uses ``Depends()`` in argument defaults as its standard DI pattern.
"app/api/**/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=7.1.0",
]
